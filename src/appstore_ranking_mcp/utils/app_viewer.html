<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Rankings Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 2px solid rgba(148, 163, 184, 0.1);
        }

        h1 {
            font-size: 2.8em;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 10px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
            margin-top: 5px;
        }

        .tab-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 28px;
            border: 2px solid #334155;
            background: rgba(30, 41, 59, 0.5);
            color: #cbd5e1;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            transition: left 0.3s;
            z-index: -1;
        }

        .tab-btn:hover {
            border-color: #60a5fa;
            color: white;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border-color: transparent;
            color: white;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.4);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-info {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.1), rgba(167, 139, 250, 0.1));
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(96, 165, 250, 0.2);
            font-size: 0.95em;
            color: #cbd5e1;
            backdrop-filter: blur(10px);
        }

        .file-info strong {
            color: #60a5fa;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .app-card {
            background: #1e293b;
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease-out;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .app-card:hover {
            border-color: #3b82f6;
            transform: translateY(-4px);
            background: #243146;
        }

        .app-position-badge {
            position: absolute;
            top: 0;
            right: 0;
            padding: 4px 12px;
            background: #3b82f6;
            border-bottom-left-radius: 12px;
            font-weight: 800;
            font-size: 0.9em;
            color: white;
            letter-spacing: 0.5px;
        }

        .app-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .app-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid rgba(96, 165, 250, 0.2);
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-weight: 700;
            font-size: 1.1em;
            color: #f1f5f9;
            word-break: break-word;
            line-height: 1.3;
        }

        .app-artist {
            font-size: 0.85em;
            color: #94a3b8;
            margin-top: 3px;
            word-break: break-word;
        }

        .app-change-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.95em;
            padding: 4px 10px;
            border-radius: 8px;
            margin-top: 8px;
            width: fit-content;
        }

        .change-up {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .change-down {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .change-none {
            background: rgba(148, 163, 184, 0.15);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .change-new {
            background: rgba(251, 146, 60, 0.15);
            color: #fb923c;
            border: 1px solid rgba(251, 146, 60, 0.3);
        }

        .position-info {
            font-size: 0.85em;
            color: #94a3b8;
            background: rgba(100, 116, 139, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .app-link {
            display: inline-block;
            padding: 12px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            transition: background 0.2s;
            margin-top: auto;
        }

        .app-link:hover {
            background: #2563eb;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .refresh-indicator {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9em;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(96, 165, 250, 0.3);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.5);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(96, 165, 250, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>App Rankings Tracker</h1>
            <p class="subtitle">Real-time app position changes on Apple App Store</p>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab(event, 'free')">Free </button>
            <button class="tab-btn" onclick="switchTab(event, 'paid')">Paid </button>
        </div>

        <div id="free" class="tab-content active">
            <div id="free-content"></div>
        </div>

        <div id="paid" class="tab-content">
            <div id="paid-content"></div>
        </div>

        <div class="refresh-indicator">
            <span class="loading-spinner"></span> Auto-refreshing every 10 seconds
        </div>
    </div>

    <script>
        function switchTab(e, tab) {
            e.preventDefault();
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            e.target.classList.add('active');
        }

        function getChangeIndicator(change) {
            if (change === null) return '<span class="change-new">NEW</span>';
            if (change > 0) return `<span class="change-up">UP +${change}</span>`;
            if (change < 0) return `<span class="change-down">DOWN ${change}</span>`;
            return '<span class="change-none">NO CHANGE</span>';
        }

        function renderApps(data, appType) {
            const container = document.getElementById(`${appType}-content`);

            if (!data || !data.changes) {
                container.innerHTML = '<div class="error">No data available for ' + appType + ' apps</div>';
                return;
            }

            let html = '';

            if (data.previous_file) {
                html += `<div class="file-info">
                    <strong>COMPARISON:</strong> LATEST VS PREVIOUS<br>
                    <small style="color: #94a3b8; margin-top: 8px; display: block;">${data.current_file} / ${data.previous_file}</small>
                </div>`;
            } else {
                html += `<div class="file-info">
                    <strong>CURRENT:</strong> ${data.current_file} <small>(FIRST SNAPSHOT)</small>
                </div>`;
            }

            html += '<div class="apps-grid">';

            data.changes.forEach(item => {
                const { position, app, change, previous_position } = item;
                const changeHtml = getChangeIndicator(change);

                let positionInfo = `Position: #${position}`;
                if (previous_position !== null && change !== null) {
                    positionInfo += ` (was #${previous_position})`;
                }

                html += `
                    <div class="app-card">
                        <div class="app-position-badge">#${position}</div>
                        <div class="app-content">
                            <div class="app-header">
                                <img src="${app.artworkUrl100}" alt="${app.name}" class="app-icon" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2270%22 height=%2270%22%3E%3Crect fill=%22%23ccc%22 width=%2270%22 height=%2270%22/%3E%3C/svg%3E'">
                                <div class="app-info">
                                    <div class="app-name">${escapeHtml(app.name)}</div>
                                    <div class="app-artist">${escapeHtml(app.artistName)}</div>
                                    <div class="app-change-badge ${change > 0 ? 'change-up' : change < 0 ? 'change-down' : change === null ? 'change-new' : 'change-none'}">
                                        ${changeHtml}
                                    </div>
                                </div>
                            </div>
                            <div class="position-info">${positionInfo}</div>
                            <a href="${app.url}" target="_blank" rel="noopener noreferrer" class="app-link">App Store</a>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                renderApps(data.free, 'free');
                renderApps(data.paid, 'paid');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('free-content').innerHTML = `<div class="error">⚠️ Error loading data: ${error.message}</div>`;
                document.getElementById('paid-content').innerHTML = `<div class="error">⚠️ Error loading data: ${error.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
        setInterval(loadData, 10000);
    </script>
</body>
</html>
