<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Momentum Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f4ec;
            --panel: #ffffff;
            --ink: #171717;
            --ink-soft: #4b5563;
            --line: #e7e2d5;
            --brand: #0f766e;
            --brand-strong: #0b5e57;
            --up-bg: #d4f6e8;
            --up-ink: #0f5132;
            --down-bg: #ffe3de;
            --down-ink: #8a1f14;
            --flat-bg: #ece8dd;
            --flat-ink: #4b5563;
            --new-bg: #ffeebd;
            --new-ink: #7a4a00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 8% 5%, #f0c77f 0%, transparent 20%),
                radial-gradient(circle at 92% 14%, #80d7cd 0%, transparent 26%),
                linear-gradient(180deg, #f9f6ee, #f6f4ec 55%);
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
            padding: 24px;
        }

        .shell {
            max-width: 1500px;
            margin: 0 auto;
            display: grid;
            gap: 18px;
        }

        .hero {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 14px 40px rgba(54, 52, 45, 0.08);
            display: grid;
            gap: 18px;
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: #0f766e;
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-family: "Space Grotesk", sans-serif;
        }

        .brand h1 {
            font-family: "Space Grotesk", sans-serif;
            letter-spacing: -0.03em;
            font-size: clamp(1.3rem, 2.1vw, 2rem);
        }

        .brand p {
            color: var(--ink-soft);
            font-size: 0.92rem;
            margin-top: 2px;
        }

        .hero-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border-radius: 12px;
            border: 1px solid transparent;
            padding: 10px 14px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            cursor: pointer;
        }

        .btn-main {
            background: var(--brand);
            color: #ffffff;
        }

        .btn-main:hover {
            background: var(--brand-strong);
            transform: translateY(-1px);
        }

        .btn-lite {
            background: #f2f0e9;
            color: var(--ink);
            border-color: #ddd6c5;
        }

        .btn-lite:hover {
            background: #ece8dd;
            transform: translateY(-1px);
        }

        .meta-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 10px;
        }

        .pill {
            background: #f8f5ed;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
        }

        .pill .k {
            display: block;
            color: var(--ink-soft);
            font-size: 0.78rem;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .pill .v {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 14px 30px rgba(54, 52, 45, 0.06);
        }

        .tabs {
            display: inline-flex;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px;
            background: #f8f6f0;
        }

        .tab-btn {
            border: 0;
            background: transparent;
            color: var(--ink-soft);
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--ink);
            box-shadow: 0 4px 12px rgba(54, 52, 45, 0.12);
        }

        .tab-content {
            display: none;
            margin-top: 18px;
            animation: rise 0.24s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .snapshot {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fcfbf7;
            padding: 12px 14px;
            color: var(--ink-soft);
            font-size: 0.9rem;
            margin-bottom: 14px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 12px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px;
            background: #fffdf8;
            display: grid;
            gap: 11px;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(54, 52, 45, 0.1);
        }

        .head {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 12px;
            align-items: start;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid #dbd4c3;
        }

        .title {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            line-height: 1.2;
            font-size: 1rem;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .artist {
            color: var(--ink-soft);
            font-size: 0.86rem;
            word-break: break-word;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .pos {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .chg {
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 6px 10px;
            letter-spacing: 0.02em;
        }

        .up {
            background: var(--up-bg);
            color: var(--up-ink);
        }

        .down {
            background: var(--down-bg);
            color: var(--down-ink);
        }

        .flat {
            background: var(--flat-bg);
            color: var(--flat-ink);
        }

        .new {
            background: var(--new-bg);
            color: var(--new-ink);
        }

        .link {
            display: inline-block;
            text-decoration: none;
            text-align: center;
            border-radius: 10px;
            padding: 9px 10px;
            font-size: 0.84rem;
            font-weight: 700;
            border: 1px solid #d3ccbb;
            color: var(--ink);
            background: #f8f5ed;
        }

        .link:hover {
            background: #efe9dd;
        }

        .error {
            background: #ffe3de;
            color: #8a1f14;
            border: 1px solid #f7b2a8;
            border-radius: 14px;
            padding: 14px;
            font-weight: 500;
        }

        .refresh {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            color: #6b7280;
            font-size: 0.87rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--brand);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            70% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }

        @media (max-width: 900px) {
            body {
                padding: 14px;
            }

            .hero {
                padding: 18px;
            }

            .meta-row {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }
        }

        @media (max-width: 540px) {
            .meta-row {
                grid-template-columns: 1fr;
            }

            .hero-top {
                align-items: start;
            }

            .hero-actions {
                width: 100%;
            }

            .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div class="hero-top">
                <div class="brand">
                    <div class="badge">AR</div>
                    <div>
                        <h1>App Momentum Dashboard</h1>
                        <p>Live App Store rank movement with fast snapshot comparisons</p>
                    </div>
                </div>
                <div class="hero-actions">
                    <a class="btn btn-main" href="/chart">Open Full-Screen Timeline</a>
                    <button id="refresh-now" class="btn btn-lite" type="button">Refresh Now</button>
                </div>
            </div>
            <div class="meta-row">
                <div class="pill"><span class="k">Current Tab</span><span id="meta-type" class="v">Free</span></div>
                <div class="pill"><span class="k">Apps Loaded</span><span id="meta-count" class="v">-</span></div>
                <div class="pill"><span class="k">Movers Up</span><span id="meta-up" class="v">-</span></div>
                <div class="pill"><span class="k">Movers Down</span><span id="meta-down" class="v">-</span></div>
            </div>
        </section>

        <section class="panel">
            <div class="tabs">
                <button class="tab-btn active" data-tab="free" type="button">Top Free</button>
                <button class="tab-btn" data-tab="paid" type="button">Top Paid</button>
            </div>

            <div id="free" class="tab-content active">
                <div class="file-selectors" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center;">
                    <label style="font-weight: 700; font-size: 0.9rem;">Compare:</label>
                    <select id="free-current" class="file-select" style="padding: 8px 12px; border-radius: 12px; border: 1px solid #d3ccbb; background: #fffdf8;"></select>
                    <label style="font-weight: 700; font-size: 0.9rem;">with</label>
                    <select id="free-previous" class="file-select" style="padding: 8px 12px; border-radius: 12px; border: 1px solid #d3ccbb; background: #fffdf8;"></select>
                    <button id="free-apply-btn" class="btn btn-lite" style="padding: 8px 14px;">Apply</button>
                </div>
                <div id="free-content"></div>
            </div>

            <div id="paid" class="tab-content">
                <div class="file-selectors" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center;">
                    <label style="font-weight: 700; font-size: 0.9rem;">Compare:</label>
                    <select id="paid-current" class="file-select" style="padding: 8px 12px; border-radius: 12px; border: 1px solid #d3ccbb; background: #fffdf8;"></select>
                    <label style="font-weight: 700; font-size: 0.9rem;">with</label>
                    <select id="paid-previous" class="file-select" style="padding: 8px 12px; border-radius: 12px; border: 1px solid #d3ccbb; background: #fffdf8;"></select>
                    <button id="paid-apply-btn" class="btn btn-lite" style="padding: 8px 14px;">Apply</button>
                </div>
                <div id="paid-content"></div>
            </div>

            <div class="refresh">
                <span class="dot"></span>
                Manual refresh only
            </div>
        </section>
    </div>

    <script>
        let latestPayload = { free: null, paid: null };
        let activeTab = "free";
        let availableFiles = { free: [], paid: [] };

        function formatFileName(filename) {
            if (!filename) return "Unknown";
            const match = filename.match(/_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})\.json/);
            if (match) {
                const date = new Date(`${match[1]}-${match[2]}-${match[3]}T${match[4]}:${match[5]}:${match[6]}Z`);
                return date.toLocaleString();
            }
            return filename;
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text || "";
            return div.innerHTML;
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll(".tab-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.tab === tabName);
            });
            document.querySelectorAll(".tab-content").forEach((tab) => {
                tab.classList.toggle("active", tab.id === tabName);
            });
            updateMeta();
        }

        function badge(change) {
            if (change === null) {
                return "<span class=\"chg new\">NEW</span>";
            }
            if (change > 0) {
                return `<span class="chg up">UP +${change}</span>`;
            }
            if (change < 0) {
                return `<span class="chg down">DOWN ${change}</span>`;
            }
            return "<span class=\"chg flat\">NO CHANGE</span>";
        }

        function renderApps(data, appType) {
            const target = document.getElementById(`${appType}-content`);
            if (!data || !Array.isArray(data.changes)) {
                target.innerHTML = `<div class="error">No ranking snapshots available for ${appType} apps.</div>`;
                return;
            }

            const sourceText = data.previous_file
                ? `Comparing: <strong>${formatFileName(data.current_file)}</strong> vs <strong>${formatFileName(data.previous_file)}</strong>`
                : `Showing: <strong>${formatFileName(data.current_file || "latest snapshot")}</strong>`;

            const cards = data.changes.map((item) => {
                const positionText = item.previous_position
                    ? `#${item.position} (was #${item.previous_position})`
                    : `#${item.position}`;

                return `
                    <article class="card">
                        <div class="head">
                            <img class="logo" src="${item.app.artworkUrl100}" alt="${escapeHtml(item.app.name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23ece8dd%22/%3E%3C/svg%3E'">
                            <div>
                                <h3 class="title">${escapeHtml(item.app.name)}</h3>
                                <p class="artist">${escapeHtml(item.app.artistName)}</p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="pos">${positionText}</div>
                            ${badge(item.change)}
                        </div>
                        <a class="link" href="${item.app.url}" target="_blank" rel="noopener noreferrer">Open in App Store</a>
                    </article>
                `;
            }).join("");

            target.innerHTML = `
                <div class="snapshot">${sourceText}</div>
                <div class="apps-grid">${cards}</div>
            `;
        }

        function updateMeta() {
            const data = latestPayload[activeTab];
            const count = data && data.changes ? data.changes.length : 0;
            const up = data && data.changes ? data.changes.filter((x) => x.change > 0).length : 0;
            const down = data && data.changes ? data.changes.filter((x) => x.change < 0).length : 0;

            document.getElementById("meta-type").textContent = activeTab === "free" ? "Free" : "Paid";
            document.getElementById("meta-count").textContent = String(count);
            document.getElementById("meta-up").textContent = String(up);
            document.getElementById("meta-down").textContent = String(down);
        }

        function populateSelect(selectId, files, selectedValue) {
            const select = document.getElementById(selectId);
            const defaultOption = selectId.includes("previous") ? `<option value="">Auto (First file with changes)</option>` : `<option value="">Auto (Latest file)</option>`;

            let options = files.map(file => {
                const selected = file === selectedValue ? "selected" : "";
                return `<option value="${file}" ${selected}>${formatFileName(file)}</option>`;
            }).join("");

            select.innerHTML = defaultOption + options;
        }

        async function loadFiles() {
            try {
                const response = await fetch("/api/files");
                if (response.ok) {
                    availableFiles = await response.json();
                }
            } catch (error) {
                console.error("Failed to load files:", error);
            }
        }

        async function loadData() {
            try {
                await loadFiles();

                const freeCurrent = document.getElementById("free-current").value;
                const freePrevious = document.getElementById("free-previous").value;
                const paidCurrent = document.getElementById("paid-current").value;
                const paidPrevious = document.getElementById("paid-previous").value;

                let url = "/api/data?";
                if (freeCurrent) url += `free_current=${encodeURIComponent(freeCurrent)}&`;
                if (freePrevious) url += `free_previous=${encodeURIComponent(freePrevious)}&`;
                if (paidCurrent) url += `paid_current=${encodeURIComponent(paidCurrent)}&`;
                if (paidPrevious) url += `paid_previous=${encodeURIComponent(paidPrevious)}`;

                const response = await fetch(url);
                const data = await response.json();
                latestPayload = data;

                // Keep the selects displaying whatever was actually chosen by auto logic
                populateSelect("free-current", availableFiles.free, data.free.current_file);
                populateSelect("free-previous", availableFiles.free, data.free.previous_file);
                populateSelect("paid-current", availableFiles.paid, data.paid.current_file);
                populateSelect("paid-previous", availableFiles.paid, data.paid.previous_file);

                renderApps(data.free, "free");
                renderApps(data.paid, "paid");
                updateMeta();
            } catch (error) {
                document.getElementById("free-content").innerHTML = `<div class="error">Failed to load free apps: ${escapeHtml(error.message)}</div>`;
                document.getElementById("paid-content").innerHTML = `<div class="error">Failed to load paid apps: ${escapeHtml(error.message)}</div>`;
            }
        }

        document.querySelectorAll(".tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => switchTab(btn.dataset.tab));
        });

        document.getElementById("free-apply-btn").addEventListener("click", loadData);
        document.getElementById("paid-apply-btn").addEventListener("click", loadData);
        document.getElementById("refresh-now").addEventListener("click", loadData);
        document.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>
